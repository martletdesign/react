name: R2 archive gateway rehearsal
on: [pull_request]
permissions:
  contents: read
jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix infra/docs-archive --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix infra/docs-archive
