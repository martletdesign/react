name: Independent React gallery
on:
  pull_request:
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        base: ['/', '/preview/']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run build:gallery
        env:
          NIGHTJAR_BASE: ${{ matrix.base }}
      - run: node scripts/check-gallery.mjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/test-gallery-browser.mjs
        env:
          DESIGN_BROWSER: ${{ matrix.browser }}
          NIGHTJAR_BASE: ${{ matrix.base }}
