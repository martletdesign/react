name: Verify standalone package
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: react-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:gallery && node scripts/check-gallery.mjs
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: node scripts/check-published.mjs
      - run: npm pack --ignore-scripts
